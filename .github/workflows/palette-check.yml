name: Palette Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generator behaviour first (partial weeks, empty windows, geometry),
      # then the palette contract across every committed asset.
      - name: Run reactor generator tests
        run: python3 scripts/test_reactor.py

      - name: Run palette smoke test
        run: python3 scripts/check_palette.py
