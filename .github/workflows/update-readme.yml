name: Update README with latest activity

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest commit
        run: |
          LATEST=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/Shivala-08/events/public" \
            | jq -r '[.[] | select(.type=="PushEvent")][0].payload.commits[0].message // "No recent activity"')
          echo "LATEST_COMMIT=$LATEST" >> $GITHUB_ENV
      - name: Update README
        run: |
          sed -i "s|<!--LATEST_COMMIT-->.*<!--END_LATEST_COMMIT-->|<!--LATEST_COMMIT-->${LATEST_COMMIT}<!--END_LATEST_COMMIT-->|" README.md
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update latest activity" || echo "No changes"
          git push
