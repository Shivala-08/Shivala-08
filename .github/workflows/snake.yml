name: Generate Contribution Snake

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
  
  # Run on every push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate the Snake SVGs (Dark & Light Cyberpunk Theme)
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # Dark Cyberpunk Snake SVG
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f472b6&color_dots=#0a0a0f,#1e1b4b,#3b82f6,#a855f7,#f472b6
            
            # Light Cyberpunk Snake SVG
            dist/github-snake.svg?color_snake=#60a5fa&color_dots=#f3f4f6,#fed7aa,#f472b6,#a855f7,#3b82f6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Push generated SVGs to output branch
      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
